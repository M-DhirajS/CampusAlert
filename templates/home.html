<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CampusAlert</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

body{
    margin:0;
    padding:0;
    font-family:'Segoe UI',sans-serif;
    background:linear-gradient(-45deg,#0d6efd,#6610f2,#20c997,#0dcaf0);
    background-size:400% 400%;
    animation:bgAnimation 12s ease infinite;
    height:100vh;
    overflow:hidden;
}

@keyframes bgAnimation{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.navbar{
backdrop-filter:blur(15px);
background:rgba(0,0,0,.25)!important;
}

.hero{

display:flex;
justify-content:center;
align-items:center;
height:90vh;

}

.card-box{

background:rgba(255,255,255,.12);

backdrop-filter:blur(20px);

padding:50px;

border-radius:25px;

width:750px;

text-align:center;

color:white;

box-shadow:0 20px 50px rgba(0,0,0,.25);

animation:float 4s ease-in-out infinite;

}

@keyframes float{

0%{transform:translateY(0px);}
50%{transform:translateY(-12px);}
100%{transform:translateY(0px);}

}

.icon{

font-size:80px;

margin-bottom:20px;

animation:rotate 8s linear infinite;

}

@keyframes rotate{

100%{transform:rotate(360deg);}

}

h1{

font-size:45px;
font-weight:bold;

}

p{

font-size:20px;

opacity:.9;

}

.btn{

padding:15px 35px;

font-size:20px;

border-radius:40px;

transition:.4s;

margin:10px;

}

.btn:hover{

transform:translateY(-6px) scale(1.05);

box-shadow:0 12px 25px rgba(0,0,0,.3);

}

.footer{

position:absolute;

bottom:15px;

width:100%;

text-align:center;

color:white;

opacity:.8;

}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark">

<div class="container">

<a class="navbar-brand fw-bold" href="#">

<i class="fa-solid fa-school"></i>

CampusAlert

</a>

</div>

</nav>

<div class="hero">

<div class="card-box">

<div class="icon">

<i class="fa-solid fa-bell"></i>

</div>

<h1>Emergency Notification & Safety Broadcast System</h1>

<p>

Instant communication between college administration and students during emergencies.

</p>

<div class="mt-4">

<a href="/login/" class="btn btn-primary">

<i class="fa-solid fa-user"></i>

Student Login

</a>

<a href="/register/" class="btn btn-success">

<i class="fa-solid fa-user-plus"></i>

Register

</a>

<a href="/admin-login/" class="btn btn-dark">

<i class="fa-solid fa-lock"></i>

Admin Login

</a>

</div>

</div>

</div>

<div class="footer">

© 2026 CampusAlert | Emergency Notification & Safety Broadcast System

</div>

</body>

</html>
